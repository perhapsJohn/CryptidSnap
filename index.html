		     A VHS tape loading in the dark: tape black, porch-light orange, the
		     on-screen-display green, so loading and the title read as one thing in

html, body, #canvas { margin: 0; padding: 0; border: 0; }
html, body { width: 100%; height: 100%; }
body {
	background: #0d0b14;
	color: #f3ead8;
	overflow: hidden;
	touch-action: none;
	-webkit-user-select: none;
	user-select: none;
	-webkit-touch-callout: none;
	-webkit-tap-highlight-color: transparent;
	overscroll-behavior: none;
}
#canvas { display: block; touch-action: none; }
#canvas:focus { outline: none; }
#status {
	position: absolute; inset: 0;
	background:
		repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.22) 0 1px, transparent 1px 3px),
		radial-gradient(ellipse at 50% 120%, #3a1d0c 0%, #160f1c 55%, #0d0b14 100%);
	display: flex; flex-direction: column; justify-content: center; align-items: center;
	gap: 0.7rem;
	visibility: hidden;
	text-align: center;
	padding: 1.5rem;
	box-sizing: border-box;
	font-family: 'VT323', 'Share Tech Mono', 'Andale Mono', ui-monospace, monospace;
}
#status-osd {
	position: absolute; top: 1rem; left: 1.2rem;
	font-size: clamp(1.2rem, 4.5vw, 1.8rem);
	color: #5cf2a6; text-shadow: 0 0 6px rgba(92, 242, 166, 0.6);
	letter-spacing: 0.06em;
}
#status-stamp {
	position: absolute; bottom: 1rem; right: 1.2rem;
	font-size: clamp(1.1rem, 4vw, 1.6rem);
	color: #ff8a2a; text-shadow: 0 0 5px rgba(255, 122, 26, 0.7);
}
#status-title {
	font-family: 'Bungee', 'Futura', 'Avenir Next', system-ui, sans-serif;
	font-size: clamp(2.4rem, 11vw, 4.8rem);
	line-height: 1;
	color: #ff7a1a;
	text-shadow: 3px 0 0 rgba(255, 79, 154, 0.55), -3px 0 0 rgba(92, 242, 166, 0.35), 0 4px 14px rgba(0, 0, 0, 0.6);
}
#status-tag { color: #a79c8a; font-size: clamp(1.15rem, 4.4vw, 1.5rem); }
#status-track {
	font-size: clamp(1.3rem, 5vw, 1.9rem); color: #f3ead8; letter-spacing: 0.18em;
	animation: blink 1.1s steps(2, start) infinite;
}
@keyframes blink { to { visibility: hidden; } }
#status-bar {
	width: min(64vw, 320px); height: 12px; margin-top: 0.3rem;
	background: #1c1726; border: 2px solid #2b2238; overflow: hidden;
	display: none;
}
#status-fill {
	height: 100%; width: 0%;
	background: repeating-linear-gradient(90deg, #ff7a1a 0 10px, #ffb347 10px 12px);
	transition: width 0.2s ease-out;
}
#status-fill.indeterminate { width: 35%; animation: slide 1.2s ease-in-out infinite alternate; }
@keyframes slide { from { margin-left: 0%; } to { margin-left: 65%; } }
#status-notice {
	display: none;
	background: #f6f1e4; color: #1c1726;
	font-family: 'Avenir Next', 'Segoe UI', system-ui, sans-serif;
	line-height: 1.45;
	max-width: 30rem; padding: 1rem 1.25rem;
	box-shadow: 0 6px 14px rgba(0, 0, 0, 0.5);
}
#status-splash { display: none; }

		<canvas id="canvas">Your browser does not support the canvas tag.</canvas>
		<noscript>Cryptid Snap needs JavaScript.</noscript>
		<div id="status">
			<img id="status-splash" class="show-image--false fullsize--true use-filter--true" src="index.png" alt="">
			<div id="status-osd">PLAY &#9654;</div>
			<div id="status-title">Cryptid Snap</div>
			<div id="status-tag">Hollow Pines County &middot; Oct 31 1986</div>
			<div id="status-track">TRACKING...</div>
			<div id="status-bar"><div id="status-fill"></div></div>
			<div id="status-notice"></div>
			<div id="status-stamp">'86 10 31</div>
		</div>

		<script>
// Browsers start audio suspended until a gesture. iOS Safari is stricter:
// * only touchend / click / keydown count as unlocking gestures;
// * resume() alone may not start the context: a (silent) sound has to be
//   started inside the gesture too;
// * with the ring/silent switch on silent, Web Audio stays muted unless an
//   HTML <audio> element is playing, which moves the page's audio session to
//   "playback" (navigator.audioSession does the same on iOS 17+);
// * a call or app switch leaves contexts "interrupted": unlock again then.
// So: keep every AudioContext the engine makes, and on every gesture resume
// any that aren't running and tick each with a one-sample silent buffer; on
// the first gesture also start a silent looping <audio> element.
(function () {
	const AC = window.AudioContext || window.webkitAudioContext;
	const ctxs = [];
	window.__csAudio = { ctxs, tag: () => tag };  // read-only debug handle (tests)
	if (AC) {
		const Wrapped = function (...args) { const c = new AC(...args); ctxs.push(c); return c; };
		Wrapped.prototype = AC.prototype;
		window.AudioContext = Wrapped;
		if (window.webkitAudioContext) { window.webkitAudioContext = Wrapped; }
	}
	// 0.1 s of 8 kHz mono silence (WAV), looped quietly to hold the audio session
	const SILENCE = 'data:audio/wav;base64,UklGRkQDAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YSADAACAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgA==';
	let tag = null;
	const holdSession = () => {
		try { if (navigator.audioSession) { navigator.audioSession.type = 'playback'; } } catch (e) { /* older Safari */ }
		if (tag) { if (tag.paused) { tag.play().catch(() => {}); } return; }
		tag = document.createElement('audio');
		tag.src = SILENCE;
		tag.loop = true;
		tag.setAttribute('playsinline', '');
		tag.volume = 0.01;
		tag.play().catch(() => {});
	};
	const tick = (c) => {
		try {
			const b = c.createBuffer(1, 1, c.sampleRate || 22050);
			const src = c.createBufferSource();
			src.buffer = b;
			src.connect(c.destination);
			src.start(0);
		} catch (e) { /* context closed */ }
	};
	const unlock = () => {
		holdSession();
		ctxs.forEach((c) => {
			if (c.state === 'closed') { return; }
			if (c.state !== 'running') { c.resume().catch(() => {}); }
			tick(c);
		});
	};
	['touchend', 'pointerup', 'click', 'keydown'].forEach((e) => document.addEventListener(e, unlock, true));
	// coming back from the background (iOS "interrupted"): the next tap unlocks again
	document.addEventListener('visibilitychange', () => {
		if (document.visibilityState === 'visible' && tag && tag.paused) { tag.play().catch(() => {}); }
	});
}());

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":20546248,"index.wasm":37686550,"index.mobile.pck":16393140},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const CS_PACK = (function () {
	const forced = new URLSearchParams(location.search).get('pack');
	if (forced === 'mobile' || forced === 'desktop') return forced === 'mobile' ? 'index.mobile.pck' : 'index.pck';
	const ua = navigator.userAgent;
	const phone = /iPhone|iPad|iPod|Android/i.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1)
		|| window.matchMedia('(max-width: 768px) and (pointer: coarse)').matches;
	return phone ? 'index.mobile.pck' : 'index.pck';  // phones never download the desktop pack
}());
const engine = new Engine(GODOT_CONFIG);

(function () {
	const overlay = document.getElementById('status');
	const bar = document.getElementById('status-bar');
	const fill = document.getElementById('status-fill');
	const notice = document.getElementById('status-notice');
	const track = document.getElementById('status-track');
	let initializing = true;
	let mode = '';

	function setMode(m) {
		if (mode === m || !initializing) { return; }
		if (m === 'hidden') { overlay.remove(); initializing = false; return; }
		overlay.style.visibility = 'visible';
		bar.style.display = m === 'progress' ? 'block' : 'none';
		notice.style.display = m === 'notice' ? 'block' : 'none';
		mode = m;
	}

	function fail(err) {
		console.error(err);
		const text = err instanceof Error ? err.message : (typeof err === 'string' ? err : 'The tape jammed while loading.');
		notice.textContent = '';
		text.split('\n').forEach((line) => { notice.appendChild(document.createTextNode(line)); notice.appendChild(document.createElement('br')); });
		track.textContent = 'NO SIGNAL';
		setMode('notice');
		initializing = false;
	}

	// Keep keyboard focus on the game after taps on the page.
	document.addEventListener('pointerdown', () => {
		const c = document.getElementById('canvas');
		if (c && document.activeElement !== c) { c.focus(); }
	}, true);
	// The page itself never zooms (pinch, double-tap) or scrolls.
	document.addEventListener('gesturestart', (e) => e.preventDefault());
	document.addEventListener('dblclick', (e) => e.preventDefault());
	document.addEventListener('touchmove', (e) => { if (e.touches.length > 1) { e.preventDefault(); } }, { passive: false });

	const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
	if (missing.length !== 0) {
		fail('This browser is missing features the game needs:\n' + missing.join('\n') + '\nTry a current Chrome, Edge, Firefox or Safari.');
		return;
	}
	setMode('progress');
	engine.startGame({
		'mainPack': CS_PACK,
		onProgress: function (current, total) {
			if (current > 0 && total > 0) {
				fill.classList.remove('indeterminate');
				fill.style.width = Math.min(100, (100 * current) / total).toFixed(1) + '%';
			} else {
				fill.classList.add('indeterminate');
			}
		},
	}).then(() => setMode('hidden'), fail);
}());
